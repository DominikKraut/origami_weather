          align: start
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Door
          - type: text
            size: 16px
            weight: '300'
            color: var(--primary-text-color)
        - entity: weather.home
          style: vertical
          align: start
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Humidity
          - type: text
            size: 16px
            weight: '300'
            color: var(--primary-text-color)
            attribute: humidity
            precision: 0
            format: '%'
      - position: custom
        position_anchor: top-right
        buttons:
        - entity: sun.sun
          type: ring
          ring_start: 25
          ring_needle: true
          ring_width: 1
          ring_color: var(--secondary-text-color)
          ring_marker_size: 12
          ring_marker_icon_size: 16
          ring_values:
          - value: 0
            marker_icon: mdi:alpha-n
            marker_icon_color: var(--primary-text-color)
          padding: 9px
          elements:
          - type: icon
            icon: mdi:circle-small
            icon_size: 12px
            color: var(--secondary-text-color)
      grid_options:
        columns: full
        rows: auto
      css: '#card-root.scheme-dark .omy{fill:#18191b}#card-root.scheme-dark .ogl{display:none}#card-root:has(ha-icon[icon="mdi:home-lightbulb"]).scheme-dark .omy{fill:#ffc56e}#card-root:has(ha-icon[icon="mdi:home-lightbulb"]).scheme-dark .ogl{display:inline}#card-root:has(ha-icon[icon="mdi:home-lightbulb"]).scheme-light .omy{fill:#e9b872}'
    - type: weather-forecast
