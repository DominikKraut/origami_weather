    - type: markdown
      visibility:
      - condition: or
        conditions:
        - condition: numeric_state
          entity: sensor.vysafac_main_brush_time_left
          below: 0
        - condition: numeric_state
          entity: sensor.vysafac_side_brush_time_left
          below: 0
        - condition: numeric_state
          entity: sensor.vysafac_filter_time_left
          below: 0
        - condition: numeric_state
