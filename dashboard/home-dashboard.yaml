        color_dark: '#24211d'
      - value: clear-night
        color: '#dbdce1'
        color_dark: '#15181f'
      - value: partlycloudy
        color: '#e0deda'
        color_dark: '#1c2023'
      - value: cloudy
        color: '#d3d4d6'
        color_dark: '#222324'
      - value: fog
        color: '#e6e6e5'
        color_dark: '#272829'
      - value: windy
        color: '#dadfdd'
        color_dark: '#1c201e'
      - value: windy-variant
        color: '#d5dad9'
        color_dark: '#1a1f1e'
      - value: rainy
        color: '#cdd2d6'
        color_dark: '#181e22'
      - value: pouring
        color: '#c8cdd2'
        color_dark: '#14191e'
      - value: lightning
        color: '#cfced3'
        color_dark: '#1c1b21'
      - value: lightning-rainy
        color: '#cacacf'
        color_dark: '#18171e'
      - value: snowy
        color: '#e6eaed'
        color_dark: '#252b2e'
      - value: snowy-rainy
        color: '#d8dddf'
        color_dark: '#1f2527'
      - value: hail
        color: '#d2d9da'
        color_dark: '#1c2324'
      - value: exceptional
        color: '#ded8d2'
        color_dark: '#27221f'
      card_height: 260px
      card_padding: 20px
      button_containers:
      - position: custom
        position_anchor: right
        image: demo-home-image
        custom_width: min(208px, 52%)
      - position: custom
        position_anchor: top-left
        button_gap: 6px
        buttons:
        - entity: sun.sun
          visibility:
          - condition: state
            entity: sun.sun
            state: above_horizon
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Sunset
          - type: text
            size: 12px
            weight: '500'
            color: var(--primary-text-color)
            entity: sun.sun
            attribute: next_setting
        - entity: sun.sun
          visibility:
          - condition: state
            entity: sun.sun
            state: below_horizon
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Sunrise
          - type: text
            size: 12px
            weight: '500'
            color: var(--primary-text-color)
            entity: sun.sun
            attribute: next_rising
      - position: custom
        position_anchor: bottom-left
        gap: 5px
        buttons:
        - entity: weather.home
          width: 100%
          elements:
          - type: text
            size: 68px
            weight: '200'
            color: var(--primary-text-color)
            attribute: temperature
            precision: 0
            format: °
        - entity: weather.home
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--primary-text-color)
      - position: custom
        position_anchor: bottom-right
        gap: 22px
        button_gap: 4px
        buttons:
        - entity: sensor.count_all_lights
          style: vertical
          align: start
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Lights
          - type: text
            size: 16px
            weight: '300'
            color: var(--primary-text-color)
            format: ' on'
          visibility: &id001
          - condition: numeric_state
            entity: sensor.count_all_lights
            above: 0
          tap_action:
            action: navigate
            navigation_path: rooms
        - entity: sensor.count_all_lights
          style: vertical
          align: start
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Lights
          - type: text
            size: 16px
            weight: '300'
            color: var(--primary-text-color)
            text: 'Off'
          visibility:
          - condition: numeric_state
            entity: sensor.count_all_lights
            below: 1
        - entity: sensor.count_all_lights
          visibility: *id001
          position: custom
          position_anchor: top-left
          background: false
          elements:
          - type: icon
            icon: mdi:home-lightbulb
            icon_size: 1px
            color: transparent
        - entity: binary_sensor.moes_door_senzor_luminance
