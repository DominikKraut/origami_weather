title: Domov
views:
- title: Home
  path: home
  icon: mdi:home-outline
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: custom:home-pulse-card
      title: '{greeting}, {name}'
      sections:
      - greeting
      - status
      - alerts
      - nudges
      persons:
      - person.dominik
      - person.lenicka
      weather_entity: weather.home
      alarm_entity: none
      mode_entity: none
      today: false
      grid_options:
        columns: full
    - type: custom:origami-weather
      weather_entity: weather.home
      color_mode: sun
      background_mode: default
      sun_enabled: true
      moon_enabled: true
      sun_moon_x: dynamic
      sun_moon_size: 64px
      cloud_effects: true
      precipitation_effects: true
      night_sky_effects: true
      bird_effects: true
      bird_density: 0.5
      plane_effects: true
      plane_density: 0.5
      balloon_effects: true
      balloon_density: 0.5
      card_height: 260px
      card_padding: 20px
      button_containers:
      - position: custom
        position_anchor: right
        image: demo-home-image
        custom_width: min(208px, 52%)
      - position: custom
        position_anchor: top-left
        button_gap: 6px
        buttons:
        - entity: sun.sun
          visibility:
          - condition: state
            entity: sun.sun
            state: above_horizon
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Sunset
          - type: text
            size: 12px
            weight: '500'
            color: var(--primary-text-color)
            entity: sun.sun
            attribute: next_setting
        - entity: sun.sun
          visibility:
          - condition: state
            entity: sun.sun
            state: below_horizon
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Sunrise
          - type: text
            size: 12px
            weight: '500'
            color: var(--primary-text-color)
            entity: sun.sun
            attribute: next_rising
      - position: custom
        position_anchor: bottom-left
        gap: 5px
        buttons:
        - entity: weather.home
          width: 100%
          elements:
          - type: text
            size: 68px
            weight: '200'
            color: var(--primary-text-color)
            attribute: temperature
            precision: 0
            format: °
        - entity: weather.home
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--primary-text-color)
      - position: custom
        position_anchor: bottom-right
        gap: 22px
        button_gap: 4px
        buttons:
        - entity: sensor.count_all_lights
          style: vertical
          align: start
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Lights
          - type: text
            size: 16px
            weight: '300'
            color: var(--primary-text-color)
            format: ' on'
          visibility: &id001
          - condition: numeric_state
            entity: sensor.count_all_lights
            above: 0
          tap_action:
            action: navigate
            navigation_path: rooms
        - entity: sensor.count_all_lights
          style: vertical
          align: start
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Lights
          - type: text
            size: 16px
            weight: '300'
            color: var(--primary-text-color)
            text: 'Off'
          visibility:
          - condition: numeric_state
            entity: sensor.count_all_lights
            below: 1
        - entity: sensor.count_all_lights
          visibility: *id001
          position: custom
          position_anchor: top-left
          background: false
          elements:
          - type: icon
            icon: mdi:home-lightbulb
            icon_size: 1px
            color: transparent
        - entity: binary_sensor.moes_door_senzor_luminance
          style: vertical
          align: start
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Door
          - type: text
            size: 16px
            weight: '300'
            color: var(--primary-text-color)
        - entity: weather.home
          style: vertical
          align: start
          elements:
          - type: text
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
            text: Humidity
          - type: text
            size: 16px
            weight: '300'
            color: var(--primary-text-color)
            attribute: humidity
            precision: 0
            format: '%'
      - position: custom
        position_anchor: top-right
        buttons:
        - entity: sun.sun
          type: ring
          ring_start: 25
          ring_needle: true
          ring_width: 1
          ring_color: var(--secondary-text-color)
          ring_marker_size: 12
          ring_marker_icon_size: 16
          ring_values:
          - value: 0
            marker_icon: mdi:alpha-n
            marker_icon_color: var(--primary-text-color)
          padding: 9px
          elements:
          - type: icon
            icon: mdi:circle-small
            icon_size: 12px
            color: var(--secondary-text-color)
      grid_options:
        columns: full
        rows: auto
      css: '#card-root.scheme-dark .omy{fill:#18191b}#card-root.scheme-dark .ogl{display:none}#card-root:has(ha-icon[icon="mdi:home-lightbulb"]).scheme-dark .omy{fill:#ffc56e}#card-root:has(ha-icon[icon="mdi:home-lightbulb"]).scheme-dark .ogl{display:inline}#card-root:has(ha-icon[icon="mdi:home-lightbulb"]).scheme-light .omy{fill:#e9b872}'
    - type: custom:home-pulse-shortcuts-card
      columns: 4
      shortcuts:
      - name: Rooms
        icon: mdi:floor-plan
        navigation_path: rooms
        badge: lights
      - name: Vacuum
        icon: mdi:robot-vacuum
        navigation_path: vacuum
        entity: vacuum.vysafac
      - name: Media
        icon: mdi:television-play
        navigation_path: rooms
        badge: media
      - name: System
        icon: mdi:cog-outline
        navigation_path: system
        badge: batteries
      grid_options:
        columns: full
    - type: markdown
      visibility:
      - condition: or
        conditions:
        - condition: numeric_state
          entity: sensor.vysafac_main_brush_time_left
          below: 0
        - condition: numeric_state
          entity: sensor.vysafac_side_brush_time_left
          below: 0
        - condition: numeric_state
          entity: sensor.vysafac_filter_time_left
          below: 0
        - condition: numeric_state
          entity: sensor.vysafac_sensor_time_left
          below: 0
        - condition: numeric_state
          entity: sensor.chodba_switch_chodba_battery
          below: 20
        - condition: numeric_state
          entity: sensor.living_room_switch_obyvak_battery
          below: 20
        - condition: numeric_state
          entity: sensor.moes_door_senzor_luminance_battery
          below: 20
      content: '{% set ns = namespace(w=[]) %}{% if states(''sensor.vysafac_main_brush_time_left'') | float(1) < 0 %}{% set ns.w = ns.w + [''🧹 Vacuum: main brush overdue''] %}{% endif %}{% if states(''sensor.vysafac_side_brush_time_left'') | float(1) < 0 %}{% set ns.w = ns.w + [''🧹 Vacuum: side brush overdue''] %}{% endif %}{% if states(''sensor.vysafac_filter_time_left'') | float(1) < 0 %}{% set ns.w = ns.w + [''🧹 Vacuum: filter overdue''] %}{% endif %}{% if states(''sensor.vysafac_sensor_time_left'') | float(1) < 0 %}{% set ns.w = ns.w + [''🧹 Vacuum: sensors overdue''] %}{% endif %}{% if states(''sensor.chodba_switch_chodba_battery'') | float(100) < 20 %}{% set ns.w = ns.w + [''🔋 Switch chodba battery '' ~ states(''sensor.chodba_switch_chodba_battery'') ~ ''%''] %}{% endif %}{% if states(''sensor.living_room_switch_obyvak_battery'') | float(100) < 20 %}{% set ns.w = ns.w + [''🔋 Switch obývák battery '' ~ states(''sensor.living_room_switch_obyvak_battery'') ~ ''%''] %}{% endif %}{% if states(''sensor.moes_door_senzor_luminance_battery'')
        | float(100) < 20 %}{% set ns.w = ns.w + [''🔋 Door sensor battery '' ~ states(''sensor.moes_door_senzor_luminance_battery'') ~ ''%''] %}{% endif %}{% for w in ns.w %}{{ w }}

        {% endfor %}'
      grid_options:
        columns: full
